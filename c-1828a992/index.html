<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Компас Большакова</title>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Компас">
<meta name="theme-color" content="#0a0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --bg-dot:#161d26;
    --surface:#131a22;
    --surface-2:#1a232e;
    --border:#283040;
    --border-soft:#1f2733;
    --text:#eef2f6;
    --muted:#8996a8;
    --accent:#ff7a45;
    --accent-dim:#5a3320;
    --branch:#4fa3e0;
    --branch-dim:#1c3547;
    --todo:#63c68a;
    --progress:#e8b84b;
    --done:#e3654f;
    --danger:#e3654f;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }

  #board{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-dot) 1.4px, transparent 1.4px);
    background-size:28px 28px;
    touch-action:none;
    overflow:hidden;
    cursor:grab;
  }
  #board.panning{cursor:grabbing;}

  #world{
    position:absolute;
    left:0;top:0;
    transform-origin:0 0;
    will-change:transform;
  }

  svg#edges{
    position:absolute;
    left:0;top:0;
    width:1px;height:1px;
    overflow:visible;
    pointer-events:none;
  }
  svg#edges path{
    fill:none;
    stroke:var(--border);
    stroke-width:2;
    stroke-linecap:round;
  }
  svg#edges path.edge-hit{
    stroke:transparent;
    pointer-events:all;
    cursor:pointer;
  }
  svg#edges path.edge-line{
    pointer-events:none;
  }
  svg#edges path.edge-line.selected{
    stroke:var(--danger);
    stroke-width:3;
  }
  svg#edges path#temp-link{
    stroke:var(--branch);
    stroke-width:2.5;
    stroke-dasharray:7 6;
    pointer-events:none;
  }
  .edge-cut{ cursor:pointer; }
  .edge-cut circle{ fill:var(--danger); }
  .edge-cut text{
    fill:#2a0805;
    font-size:15px;
    font-weight:800;
    text-anchor:middle;
    dominant-baseline:central;
    font-family:'Sora',sans-serif;
    pointer-events:none;
  }

  .node{
    position:absolute;
    left:0;top:0;
    transform:translate(-50%,-50%);
    display:inline-flex;
    align-items:center;
    gap:8px;
    max-width:220px;
    padding:10px 15px;
    border-radius:999px;
    background:var(--surface);
    border:1.5px solid var(--border);
    color:var(--text);
    font-size:13.5px;
    font-weight:500;
    line-height:1.3;
    white-space:normal;
    box-shadow:var(--shadow);
    touch-action:none;
    cursor:grab;
  }
  .node.editing{
    cursor:text;
    outline:none;
    border-color:var(--accent);
  }
  .node .txt{outline:none;}
  .node.dragging{cursor:grabbing;box-shadow:0 16px 40px -14px rgba(0,0,0,.75);}

  .node.goal{
    background:linear-gradient(155deg,var(--accent),#e0602e);
    border-color:transparent;
    color:#1a0d06;
    font-weight:800;
    font-size:16px;
    padding:16px 24px;
    max-width:260px;
    text-align:center;
    justify-content:center;
  }
  .node.branch{
    border-color:var(--branch);
    background:linear-gradient(155deg,var(--branch-dim),var(--surface) 70%);
    font-weight:700;
    font-size:14.5px;
    padding:12px 18px;
  }
  .node.leaf{font-weight:500;}

  .node.selected{
    box-shadow:0 0 0 3px var(--branch), var(--shadow);
  }

  .dot{
    width:8px;height:8px;min-width:8px;
    border-radius:50%;
    background:var(--todo);
  }
  .node[data-status="progress"] .dot{background:var(--progress);}
  .node[data-status="done"] .dot{background:var(--done);}

  .edit-btn{
    position:absolute;
    bottom:-9px;right:-9px;
    width:25px;height:25px;
    border-radius:50%;
    background:var(--surface-2);
    border:2px solid var(--bg);
    color:var(--text);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    touch-action:none;
  }
  .node.goal .edit-btn{background:#e0602e;}
  .node.branch .edit-btn{background:var(--branch-dim);border-color:var(--bg);}

  .port{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:22px;height:22px;
    border-radius:50%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    touch-action:none;
    z-index:2;
  }
  .port-top{top:-10px;}
  .port-bottom{bottom:-10px;}
  .port:active{background:var(--branch);border-color:var(--branch);color:#04101a;}

  .del-btn{
    position:absolute;
    top:-9px;right:-9px;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--danger);
    color:#2a0805;
    border:2px solid var(--bg);
    font-size:13px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    touch-action:none;
  }

  /* chrome */
  .topbar{
    position:fixed;
    top:14px;left:14px;right:14px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    z-index:5;
  }
  .brand{
    font-weight:800;
    font-size:15px;
    letter-spacing:-.01em;
  }
  .brand small{
    display:block;
    margin-top:2px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .legend{
    display:flex;
    gap:12px;
    background:rgba(19,26,34,.85);
    backdrop-filter:blur(6px);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:7px 11px;
    pointer-events:auto;
  }
  .legend span{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .legend .dot{min-width:7px;width:7px;height:7px;}

  .hint{
    position:fixed;
    top:64px;left:50%;
    transform:translateX(-50%);
    background:rgba(79,163,224,.15);
    border:1px solid var(--branch);
    color:#cfe8ff;
    font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;
    padding:7px 14px;
    border-radius:999px;
    z-index:6;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .hint.show{opacity:1;}

  .toolbar{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    background:rgba(19,26,34,.92);
    backdrop-filter:blur(10px);
    border:1px solid var(--border-soft);
    border-radius:999px;
    padding:6px;
    box-shadow:var(--shadow);
    z-index:5;
  }
  .toolbar button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:11px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    min-height:44px;
  }
  .toolbar button:active{background:var(--surface-2);}
  .toolbar button.primary{background:var(--accent);color:#1a0d06;}
  .toolbar button.active{background:var(--branch);color:#04101a;}
  .toolbar .sep{width:1px;background:var(--border);margin:6px 2px;}

  @media (max-width:520px){
    .legend{display:none;}
    .toolbar button{padding:11px 12px;font-size:12.5px;}
  }

  #lock{
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    padding:24px;
    text-align:center;
  }
  #lock.hidden{display:none;}
  #lock .glyph{font-size:34px;}
  #lock h1{
    margin:0;
    font-size:16px;
    font-weight:700;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  #lock form{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  #lock input{
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 16px;
    color:var(--text);
    font-size:16px;
    width:180px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.08em;
  }
  #lock input:focus{outline:none;border-color:var(--accent);}
  #lock button{
    background:var(--accent);
    border:none;
    color:#1a0d06;
    font-weight:700;
    border-radius:12px;
    padding:0 20px;
    font-size:15px;
    cursor:pointer;
  }
  #lock .err{
    color:var(--danger);
    font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;
    min-height:16px;
  }
</style>
</head>
<body>

<div id="lock">
  <div class="glyph">🧭</div>
  <h1>Доступ только для Андрея</h1>
  <form id="lock-form" autocomplete="off">
    <input type="password" id="lock-input" placeholder="пароль" inputmode="text">
    <button type="submit">Войти</button>
  </form>
  <div class="err" id="lock-err"></div>
</div>

<div id="board">
  <div id="world">
    <svg id="edges">
      <g id="edge-group"></g>
      <path id="temp-link" d="" style="display:none;"></path>
    </svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="topbar">
  <div class="brand">Компас<small>карта цели · @bolshakoff.life</small></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--todo)"></i>открыта</span>
    <span><i class="dot" style="background:var(--progress)"></i>в деле</span>
    <span><i class="dot" style="background:var(--done)"></i>закрыта</span>
  </div>
</div>

<div class="hint" id="hint"></div>

<div class="toolbar">
  <button class="primary" id="btn-add">+ Узел</button>
  <button id="btn-link">Связать</button>
  <div class="sep"></div>
  <button id="btn-fit">По размеру</button>
  <button id="btn-reset">Сброс</button>
</div>

<script>
(function(){
  // Замена пароля: впиши новую фразу, посчитай sha256 (в терминале: printf 'фраза' | shasum -a 256)
  // и вставь хэш сюда вместо текущего.
  const LOCK_HASH = 'c2297c19063da3a9aa43995ae9b48ea9e7ac29fb5b1431da8406ee4fc5848877';
  const LOCK_KEY = 'kompas-unlocked-v1';

  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }

  const lockEl = document.getElementById('lock');
  const lockForm = document.getElementById('lock-form');
  const lockInput = document.getElementById('lock-input');
  const lockErr = document.getElementById('lock-err');

  function unlock(){
    lockEl.classList.add('hidden');
    try{ localStorage.setItem(LOCK_KEY, '1'); }catch(e){}
  }

  let alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem(LOCK_KEY) === '1'; }catch(e){}

  if(alreadyUnlocked){
    unlock();
  } else {
    lockForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const hash = await sha256(lockInput.value.trim());
      if(hash === LOCK_HASH){
        unlock();
      } else {
        lockErr.textContent = 'Неверно, попробуй ещё';
        lockInput.value = '';
        lockInput.focus();
      }
    });
  }

  const LSKEY = 'kompas-bolshakova-v1';

  const DEFAULT_STATE = {
    nodes: [
      {id:'goal', kind:'goal', status:null, x:0, y:-280, text:'Быть крутым, собой — личный бренд @bolshakoff.life'},

      {id:'brand', kind:'branch', status:'progress', x:-380, y:-20, text:'Личный бренд — главный трек'},
      {id:'baza',  kind:'branch', status:'progress', x:380,  y:-20, text:'БАЗА — топливо'},

      {id:'b1', kind:'leaf', status:'done',     x:-700, y:240, text:'4 Reels опубликовано, данные собраны'},
      {id:'b2', kind:'leaf', status:'done',     x:-520, y:260, text:'Рычаг: подписка за участие ×10 к конверсии'},
      {id:'b3', kind:'leaf', status:'progress', x:-340, y:260, text:'Закрыть аукцион 3.10 + ответить @arsvek'},
      {id:'b4', kind:'leaf', status:'todo',     x:-160, y:250, text:'Повторить рычаг в новом формате'},
      {id:'b5', kind:'leaf', status:'todo',     x:-380, y:400, text:'Монолог из заметки 5 сентября'},

      {id:'z1', kind:'leaf', status:'progress', x:60,  y:250, text:'Решение по кредитке — сегодня'},
      {id:'z2', kind:'leaf', status:'todo',     x:240, y:260, text:'Таблица остатков склада'},
      {id:'z3', kind:'leaf', status:'todo',     x:420, y:260, text:'Выкладка объявлений пулами'},
      {id:'z4', kind:'leaf', status:'todo',     x:600, y:250, text:'График 5/2 с 1 октября'},
      {id:'z5', kind:'leaf', status:'todo',     x:380, y:400, text:'Закуп 425 000 ₽ — 1 ноября'}
    ],
    edges: [
      {a:'goal',b:'brand'},{a:'goal',b:'baza'},
      {a:'brand',b:'b1'},{a:'brand',b:'b2'},{a:'brand',b:'b3'},{a:'brand',b:'b4'},{a:'brand',b:'b5'},
      {a:'baza',b:'z1'},{a:'baza',b:'z2'},{a:'baza',b:'z3'},{a:'baza',b:'z4'},{a:'baza',b:'z5'}
    ]
  };

  // Довесок 25.09: остальные проекты — добавляется один раз поверх того,
  // что уже есть в памяти телефона, ничего существующего не трогает.
  const SEED_V2 = {
    nodes: [
      {id:'zap', kind:'branch', status:'progress', x:-820, y:680, text:'Запчасти — dvigatel-ekb.ru'},
      {id:'avt', kind:'branch', status:'progress', x:-370, y:680, text:'Авторазбор — Авито, Hyundai'},
      {id:'sys', kind:'branch', status:'progress', x:90,   y:680, text:'Личная система — деньги и режим'},
      {id:'mal', kind:'branch', status:'todo',     x:550,  y:680, text:'Курс автомаляра — на паузе'},
      {id:'per', kind:'branch', status:'todo',     x:950,  y:680, text:'Перекуп авто — отложено до марта 2027'},

      {id:'zap1', kind:'leaf', status:'done',     x:-980, y:900,  text:'Сайт запущен, домен и SSL подключены'},
      {id:'zap2', kind:'leaf', status:'done',     x:-820, y:900,  text:'1182 позиции, 5722 фото в каталоге'},
      {id:'zap3', kind:'leaf', status:'progress', x:-660, y:900,  text:'Директ запущен 27.08 — чистим минус-слова'},
      {id:'zap4', kind:'leaf', status:'todo',     x:-980, y:1040, text:'Проверить WhatsApp Business на номере 025-28-92'},
      {id:'zap5', kind:'leaf', status:'todo',     x:-820, y:1040, text:'Запустить Авито Рекламу — баннеры готовы'},
      {id:'zap6', kind:'leaf', status:'todo',     x:-660, y:1040, text:'Перевыпустить токен Telegram-бота'},

      {id:'avt1', kind:'leaf', status:'done',     x:-500, y:900,  text:'Вышел на Авито 17.08 — спец. по Hyundai АКПП/МКПП'},
      {id:'avt2', kind:'leaf', status:'progress', x:-370, y:900,  text:'Тест 10 дней: 500 ₽/день, считаем обращения'},
      {id:'avt3', kind:'leaf', status:'todo',     x:-240, y:900,  text:'Добавить каталог поставщика — 1182 позиции, наценка 33%'},

      {id:'sys1', kind:'leaf', status:'progress', x:-20,  y:900,  text:'375 000 ₽ неприкосновенны до ноября'},
      {id:'sys2', kind:'leaf', status:'progress', x:130,  y:900,  text:'Стоп работы в 20:00'},
      {id:'sys3', kind:'leaf', status:'todo',     x:280,  y:900,  text:'1 ноября — сверка кассы, пересобрать систему'},

      {id:'mal1', kind:'leaf', status:'done',     x:480,  y:900,  text:'Видео 2,5 ч отснято с мастером'},
      {id:'mal2', kind:'leaf', status:'todo',     x:620,  y:900,  text:'На паузе с 18.08 — решить, когда возобновлять'},

      {id:'per1', kind:'leaf', status:'done',     x:880,  y:900,  text:'Идея разобрана 18.08 — деньги в машины не идут'},
      {id:'per2', kind:'leaf', status:'todo',     x:1020, y:900,  text:'Контент про схемы перекупов — 0 ₽, можно снимать уже'}
    ],
    edges: [
      {a:'goal',b:'zap'},{a:'goal',b:'avt'},{a:'goal',b:'sys'},{a:'goal',b:'mal'},{a:'goal',b:'per'},
      {a:'zap',b:'zap1'},{a:'zap',b:'zap2'},{a:'zap',b:'zap3'},{a:'zap',b:'zap4'},{a:'zap',b:'zap5'},{a:'zap',b:'zap6'},
      {a:'avt',b:'avt1'},{a:'avt',b:'avt2'},{a:'avt',b:'avt3'},
      {a:'sys',b:'sys1'},{a:'sys',b:'sys2'},{a:'sys',b:'sys3'},
      {a:'mal',b:'mal1'},{a:'mal',b:'mal2'},
      {a:'per',b:'per1'},{a:'per',b:'per2'}
    ]
  };

  // Довесок 25.09 (второй): узел-чекпоинт октября и связи между ветками —
  // показывают, что одна задача реально тянет другую, а не просто дерево.
  const SEED_V3 = {
    nodes: [
      {id:'z6', kind:'leaf', status:'progress', x:560, y:400, text:'Октябрь — минимум 15 комплектов чистыми'}
    ],
    edges: [
      {a:'baza', b:'z6'},
      {a:'z2', b:'z6'},
      {a:'z6', b:'z5'},
      {a:'z6', b:'sys3'},
      {a:'z1', b:'z5'},
      {a:'sys1', b:'z5'},
      {a:'zap2', b:'avt3'},
      {a:'per2', b:'brand'},
      {a:'b2', b:'b4'}
    ]
  };

  // 25.09 (третий): решил не распыляться — авторазбор, курс маляра, запчасти
  // и перекуп авто убираются с карты. Остаётся только БАЗА, бренд и личная система.
  const PRUNE_V4 = [
    'zap','avt','mal','per',
    'zap1','zap2','zap3','zap4','zap5','zap6',
    'avt1','avt2','avt3',
    'mal1','mal2',
    'per1','per2'
  ];

  // 26.09: зафиксирован постоянный ритм контента — 2 Reels в неделю,
  // не больше. Аукцион переведён с разового на еженедельный.
  const SEED_V5 = {
    nodes: [
      {id:'b6', kind:'leaf', status:'progress', x:-520, y:550, text:'Понедельник — Reels: спорт/доски/путешествия/экстрим'},
      {id:'b7', kind:'leaf', status:'progress', x:-160, y:550, text:'Четверг — аукцион доски каждую неделю, закрытие в среду'}
    ],
    edges: [
      {a:'brand', b:'b6'},
      {a:'brand', b:'b7'},
      {a:'b3', b:'b7'},
      {a:'z2', b:'b7'}
    ]
  };

  const SEEDS = [
    {version:2, nodes:SEED_V2.nodes, edges:SEED_V2.edges},
    {version:3, nodes:SEED_V3.nodes, edges:SEED_V3.edges},
    {version:4, remove:PRUNE_V4},
    {version:5, nodes:SEED_V5.nodes, edges:SEED_V5.edges}
  ];

  function applySeeds(st){
    if(!st.seedVersion) st.seedVersion = 1;
    const known = new Set(st.nodes.map(n => n.id));
    const knownEdge = new Set(st.edges.map(e => e.a+'>'+e.b));
    SEEDS.forEach(seed => {
      if(st.seedVersion < seed.version){
        if(seed.nodes) seed.nodes.forEach(n => { if(!known.has(n.id)){ st.nodes.push(n); known.add(n.id); } });
        if(seed.edges) seed.edges.forEach(e => { const k=e.a+'>'+e.b; if(!knownEdge.has(k)){ st.edges.push(e); knownEdge.add(k); } });
        if(seed.remove){
          const removeSet = new Set(seed.remove);
          st.nodes = st.nodes.filter(n => !removeSet.has(n.id));
          st.edges = st.edges.filter(e => !removeSet.has(e.a) && !removeSet.has(e.b));
        }
        st.seedVersion = seed.version;
      }
    });
    return st;
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(LSKEY);
      if(raw) return applySeeds(JSON.parse(raw));
    }catch(e){}
    return applySeeds(JSON.parse(JSON.stringify(DEFAULT_STATE)));
  }
  function saveState(){
    try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){}
  }

  let state = loadState();
  saveState();

  const boardEl = document.getElementById('board');
  const worldEl = document.getElementById('world');
  const nodesEl = document.getElementById('nodes');
  const hintEl = document.getElementById('hint');

  let panX = 0, panY = 0, zoom = 1;
  function applyTransform(){
    worldEl.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  }

  function boardRect(){ return boardEl.getBoundingClientRect(); }
  function screenToWorld(sx, sy){
    const r = boardRect();
    return { x: (sx - r.left - panX) / zoom, y: (sy - r.top - panY) / zoom };
  }

  function showHint(text, ms){
    hintEl.textContent = text;
    hintEl.classList.add('show');
    if(ms){ clearTimeout(showHint._t); showHint._t = setTimeout(()=>hintEl.classList.remove('show'), ms); }
  }
  function hideHint(){ hintEl.classList.remove('show'); }

  function fitView(){
    const ns = state.nodes;
    if(!ns.length) return;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    ns.forEach(n=>{
      minX=Math.min(minX,n.x-120); maxX=Math.max(maxX,n.x+120);
      minY=Math.min(minY,n.y-60);  maxY=Math.max(maxY,n.y+60);
    });
    const r = boardRect();
    const w = maxX-minX, h = maxY-minY;
    const z = Math.min(r.width/w, r.height/h, 1.3);
    zoom = Math.max(z, 0.12);
    panX = r.width/2 - (minX+maxX)/2*zoom;
    panY = r.height/2 - (minY+maxY)/2*zoom;
    applyTransform();
  }

  // ---------- rendering ----------

  function statusOf(node){ return node.status || 'todo'; }

  function nodeClass(node){
    let c = 'node ' + node.kind;
    if(node.kind !== 'goal' && statusOf(node) === 'done') c += ' done';
    return c;
  }

  let connectMode = false;
  let connectFirst = null;
  let selectedEdge = null;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const edgeGroup = document.getElementById('edge-group');
  const tempLink = document.getElementById('temp-link');

  function edgeKey(a,b){ return a+'>'+b; }

  function clearEdgeSelection(){
    if(selectedEdge){ selectedEdge = null; redrawEdges(); }
  }

  function render(){
    nodesEl.innerHTML = '';
    state.nodes.forEach(node => {
      const el = document.createElement('div');
      el.className = nodeClass(node);
      el.dataset.id = node.id;
      if(node.kind !== 'goal') el.setAttribute('data-status', statusOf(node));
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      if(connectMode && connectFirst === node.id) el.classList.add('selected');

      if(node.kind !== 'goal'){
        const dot = document.createElement('i');
        dot.className = 'dot';
        el.appendChild(dot);
      }
      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = node.text;
      el.appendChild(txt);

      const editBtn = document.createElement('div');
      editBtn.className = 'edit-btn';
      editBtn.textContent = '✏️';
      editBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); e.preventDefault(); });
      editBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        enterEdit(el, node);
      });
      el.appendChild(editBtn);

      if(node.kind !== 'goal'){
        const delBtn = document.createElement('div');
        delBtn.className = 'del-btn';
        delBtn.textContent = '✕';
        delBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); e.preventDefault(); });
        delBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if(confirm('Удалить узел «' + node.text + '»?')) deleteNode(node.id);
        });
        el.appendChild(delBtn);
      }

      ['top','bottom'].forEach(pos => {
        const port = document.createElement('div');
        port.className = 'port port-' + pos;
        port.textContent = '+';
        port.addEventListener('pointerdown', (e)=> startLinking(e, node));
        el.appendChild(port);
      });

      attachNodeHandlers(el, node);
      nodesEl.appendChild(el);
    });
    redrawEdges();
  }

  function redrawEdges(){
    edgeGroup.innerHTML = '';
    const byId = {};
    state.nodes.forEach(n=>byId[n.id]=n);
    state.edges.forEach(e=>{
      const a = byId[e.a], b = byId[e.b];
      if(!a || !b) return;
      const mx = (a.x+b.x)/2, my=(a.y+b.y)/2;
      const dx = b.x-a.x, dy = b.y-a.y;
      const bow = 0.12;
      const cx = mx - dy*bow, cy = my + dx*bow;
      const d = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
      const key = edgeKey(e.a, e.b);
      const isSelected = selectedEdge === key;

      const hit = document.createElementNS(SVGNS,'path');
      hit.setAttribute('d', d);
      hit.setAttribute('class','edge-hit');
      hit.setAttribute('stroke-width', Math.max(24 / zoom, 24));
      hit.addEventListener('pointerdown', ev => ev.stopPropagation());
      hit.addEventListener('click', ev => {
        ev.stopPropagation();
        selectedEdge = isSelected ? null : key;
        redrawEdges();
      });
      edgeGroup.appendChild(hit);

      const line = document.createElementNS(SVGNS,'path');
      line.setAttribute('d', d);
      line.setAttribute('class', 'edge-line' + (isSelected ? ' selected' : ''));
      edgeGroup.appendChild(line);

      if(isSelected){
        const cutG = document.createElementNS(SVGNS,'g');
        cutG.setAttribute('class','edge-cut');
        cutG.setAttribute('transform', `translate(${cx},${cy}) scale(${1/zoom})`);
        const circle = document.createElementNS(SVGNS,'circle');
        circle.setAttribute('r','16');
        const text = document.createElementNS(SVGNS,'text');
        text.textContent = '−';
        cutG.appendChild(circle);
        cutG.appendChild(text);
        cutG.addEventListener('pointerdown', ev => ev.stopPropagation());
        cutG.addEventListener('click', ev => {
          ev.stopPropagation();
          state.edges = state.edges.filter(x => edgeKey(x.a,x.b) !== key);
          selectedEdge = null;
          saveState();
          redrawEdges();
        });
        edgeGroup.appendChild(cutG);
      }
    });
  }

  function startLinking(e, sourceNode){
    e.stopPropagation();
    e.preventDefault();
    clearEdgeSelection();
    const startClientX = e.clientX, startClientY = e.clientY;

    function updateTemp(cx, cy){
      const p = screenToWorld(cx, cy);
      tempLink.setAttribute('d', `M ${sourceNode.x} ${sourceNode.y} L ${p.x} ${p.y}`);
    }
    tempLink.style.display = '';
    updateTemp(startClientX, startClientY);

    function onMove(ev){ updateTemp(ev.clientX, ev.clientY); }

    function onUp(ev){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      tempLink.style.display = 'none';

      const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetNodeEl = dropEl ? dropEl.closest('.node') : null;
      const dist = Math.hypot(ev.clientX-startClientX, ev.clientY-startClientY);

      if(targetNodeEl && targetNodeEl.dataset.id !== sourceNode.id){
        const targetId = targetNodeEl.dataset.id;
        const exists = state.edges.some(x =>
          (x.a===sourceNode.id && x.b===targetId) || (x.a===targetId && x.b===sourceNode.id));
        if(!exists){
          state.edges.push({a: sourceNode.id, b: targetId});
          saveState();
          redrawEdges();
        }
      } else if(!targetNodeEl && dist > 15){
        const p = screenToWorld(ev.clientX, ev.clientY);
        const id = 'n' + Date.now();
        const newNode = {id, kind:'leaf', status:'todo', x:p.x, y:p.y, text:''};
        state.nodes.push(newNode);
        state.edges.push({a: sourceNode.id, b: id});
        saveState();
        render();
        requestAnimationFrame(()=>{
          const elNew = nodesEl.querySelector(`[data-id="${id}"]`);
          if(elNew) enterEdit(elNew, newNode);
        });
      }
    }
    function onCancel(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      tempLink.style.display = 'none';
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  }

  // ---------- node interaction ----------

  function attachNodeHandlers(el, node){
    let startX=0, startY=0, startNX=0, startNY=0, moved=false, pointerId=null;

    el.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      if(el.classList.contains('editing')) return;
      clearEdgeSelection();
      pointerId = e.pointerId;
      try{ el.setPointerCapture(pointerId); }catch(err){}
      startX = e.clientX; startY = e.clientY;
      startNX = node.x; startNY = node.y;
      moved = false;
      el.classList.add('dragging');
    });

    el.addEventListener('pointermove', (e)=>{
      if(e.pointerId !== pointerId) return;
      const dx = (e.clientX - startX)/zoom;
      const dy = (e.clientY - startY)/zoom;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
        moved = true;
        node.x = startNX + dx;
        node.y = startNY + dy;
        el.style.left = node.x+'px';
        el.style.top = node.y+'px';
        redrawEdges();
      }
    });

    el.addEventListener('pointerup', (e)=>{
      if(e.pointerId !== pointerId) return;
      el.classList.remove('dragging');
      try{ el.releasePointerCapture(pointerId); }catch(err){}
      if(moved){
        saveState();
      } else if(!el.classList.contains('editing')){
        handleTap(node);
      }
      pointerId = null;
    });

    el.addEventListener('pointercancel', ()=>{
      el.classList.remove('dragging');
      pointerId = null;
    });
  }

  function cycleStatus(node){
    const order = ['todo','progress','done'];
    const i = order.indexOf(statusOf(node));
    node.status = order[(i+1) % order.length];
    saveState();
    render();
  }

  function handleTap(node){
    if(connectMode){
      handleConnectTap(node.id);
      return;
    }
    if(node.kind === 'goal') return;
    cycleStatus(node);
  }

  function handleConnectTap(id){
    if(!connectFirst){
      connectFirst = id;
      showHint('Теперь выбери второй узел');
      render();
      return;
    }
    if(id !== connectFirst){
      const exists = state.edges.some(e =>
        (e.a===connectFirst && e.b===id) || (e.a===id && e.b===connectFirst));
      if(!exists) state.edges.push({a:connectFirst, b:id});
      saveState();
    }
    connectFirst = null;
    connectMode = false;
    document.getElementById('btn-link').classList.remove('active');
    hideHint();
    render();
  }

  function deleteNode(id){
    state.nodes = state.nodes.filter(n => n.id !== id);
    state.edges = state.edges.filter(e => e.a !== id && e.b !== id);
    saveState();
    render();
  }

  function enterEdit(el, node){
    if(el.classList.contains('editing')) return;
    el.classList.add('editing');
    const editBtn = el.querySelector('.edit-btn');
    if(editBtn) editBtn.style.display = 'none';
    const delBtn = el.querySelector('.del-btn');
    if(delBtn) delBtn.style.display = 'none';
    el.querySelectorAll('.port').forEach(p => p.style.display = 'none');
    const txt = el.querySelector('.txt');
    txt.contentEditable = 'true';
    txt.focus();
    const range = document.createRange();
    range.selectNodeContents(txt);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function commit(){
      if(!el.classList.contains('editing')) return;
      const v = txt.textContent.trim();
      if(v) node.text = v;
      saveState();
      render();
    }

    txt.addEventListener('blur', commit, {once:true});
    txt.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        txt.blur();
      }
    });
  }

  // ---------- board pan / pinch ----------

  const pointers = new Map();
  let panState = null;
  let pinchState = null;

  boardEl.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.node')) return;
    clearEdgeSelection();
    try{ boardEl.setPointerCapture(e.pointerId); }catch(err){}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 1){
      boardEl.classList.add('panning');
      panState = {startX:e.clientX, startY:e.clientY, originX:panX, originY:panY};
      pinchState = null;
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      const worldMid = screenToWorld(midX, midY);
      pinchState = {startDist:dist, startZoom:zoom, worldMid};
      panState = null;
    }
  });

  boardEl.addEventListener('pointermove', (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pinchState && pointers.size === 2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      zoom = Math.min(2.5, Math.max(0.12, pinchState.startZoom * (dist/pinchState.startDist)));
      const r = boardRect();
      panX = (midX - r.left) - pinchState.worldMid.x*zoom;
      panY = (midY - r.top) - pinchState.worldMid.y*zoom;
      applyTransform();
    } else if(panState && pointers.size === 1){
      panX = panState.originX + (e.clientX - panState.startX);
      panY = panState.originY + (e.clientY - panState.startY);
      applyTransform();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      boardEl.classList.remove('panning');
      panState = null; pinchState = null;
    } else if(pointers.size === 1){
      const [ [id,p] ] = pointers;
      panState = {startX:p.x, startY:p.y, originX:panX, originY:panY};
      pinchState = null;
    }
  }
  boardEl.addEventListener('pointerup', endPointer);
  boardEl.addEventListener('pointercancel', endPointer);

  // ---------- toolbar ----------

  document.getElementById('btn-add').addEventListener('click', ()=>{
    const r = boardRect();
    const pos = screenToWorld(r.left + r.width/2, r.top + r.height/2 + (Math.random()*60-30));
    const id = 'n' + Date.now();
    const node = {id, kind:'leaf', status:'todo', x:pos.x, y:pos.y, text:''};
    state.nodes.push(node);
    saveState();
    render();
    requestAnimationFrame(()=>{
      const el = nodesEl.querySelector(`[data-id="${id}"]`);
      if(el) enterEdit(el, node);
    });
  });

  const btnLink = document.getElementById('btn-link');
  btnLink.addEventListener('click', ()=>{
    connectMode = !connectMode;
    connectFirst = null;
    btnLink.classList.toggle('active', connectMode);
    if(connectMode) showHint('Выбери первый узел');
    else hideHint();
    render();
  });

  document.getElementById('btn-fit').addEventListener('click', ()=> fitView());

  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if(confirm('Сбросить карту к исходной? Все свои узлы и связи удалятся.')){
      state = applySeeds(JSON.parse(JSON.stringify(DEFAULT_STATE)));
      saveState();
      render();
      fitView();
    }
  });

  window.addEventListener('resize', ()=> fitView());

  render();
  fitView();
})();
</script>
</body>
</html>
